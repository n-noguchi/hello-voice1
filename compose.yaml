name: hello-voice1

services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "${OLLAMA_HOST_PORT:-11435}:11434"
    volumes:
      - ${OLLAMA_DATA_PATH:-ollama-data}:/root/.ollama
    gpus: all
    environment:
      OLLAMA_HOST: "0.0.0.0:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 10

  voicevox:
    image: voicevox/voicevox_engine:cpu-ubuntu20.04-latest
    ports:
      - "${VOICEVOX_HOST_PORT:-50021}:50021"
    healthcheck:
      test:
        [
          "CMD",
          "/opt/python/bin/python3",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:50021/version', timeout=3).read()",
        ]
      interval: 15s
      timeout: 10s
      retries: 20

  backend:
    build:
      context: ./services/assistant-core
      args:
        INSTALL_STT: "${INSTALL_STT:-1}"
    ports:
      - "${BACKEND_HOST_PORT:-8000}:8000"
    volumes:
      - backend-data:/data
    environment:
      HELLO_VOICE_DATA_DIR: /data
      HELLO_VOICE_OLLAMA_BASE_URL: http://ollama:11434
      HELLO_VOICE_VOICEVOX_BASE_URL: http://voicevox:50021
      HELLO_VOICE_TTS_PROVIDER: voicevox
      HELLO_VOICE_STT_PROVIDER: "${HELLO_VOICE_STT_PROVIDER:-faster_whisper}"
      HF_HOME: /data/huggingface
    depends_on:
      ollama:
        condition: service_healthy
      voicevox:
        condition: service_healthy

  ui:
    build:
      context: .
      dockerfile: apps/desktop/Dockerfile
    ports:
      - "${UI_HOST_PORT:-1420}:80"
    depends_on:
      backend:
        condition: service_started

volumes:
  ollama-data:
  backend-data:
