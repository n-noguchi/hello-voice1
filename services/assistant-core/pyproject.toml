[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hello-voice-assistant-core"
version = "0.1.0"
description = "Local OSS voice assistant backend for hello-voice1"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "python-multipart>=0.0.9",
  "uvicorn[standard]>=0.30.0"
]

[project.optional-dependencies]
stt = [
  "faster-whisper>=1.0.0"
]
voice = [
  "faster-whisper>=1.0.0",
  "numpy>=1.26.0",
  "sounddevice>=0.4.7",
  "soundfile>=0.12.1",
  "torch>=2.3.0"
]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.0",
  "ruff>=0.5.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["assistant_core*"]
